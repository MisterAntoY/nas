<svg xmlns="http://www.w3.org/2000/svg" width="220" height="400" viewBox="0 0 220 400">
  <defs>
    <linearGradient id="sv" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#484858"/>
      <stop offset="28%"  stop-color="#9898B0"/>
      <stop offset="50%"  stop-color="#EBEBF5"/>
      <stop offset="72%"  stop-color="#9898B0"/>
      <stop offset="100%" stop-color="#484858"/>
    </linearGradient>
    <linearGradient id="svdrop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#D0D0E0"/>
      <stop offset="40%"  stop-color="#F5F5FF"/>
      <stop offset="100%" stop-color="#707080"/>
    </linearGradient>
    <filter id="svsh">
      <feDropShadow dx="3" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Hook/wire -->
  <path d="M 110 18 C 110 18, 145 18, 155 35 C 165 52, 150 72, 130 72" fill="none" stroke="url(#sv)" stroke-width="7" stroke-linecap="round"/>
  <!-- Chain segment -->
  <line x1="110" y1="18" x2="110" y2="72" stroke="url(#sv)" stroke-width="5" stroke-linecap="round"/>
  <!-- Small connector bead -->
  <ellipse cx="110" cy="78" rx="7" ry="7" fill="url(#sv)"/>
  <!-- Chain continuation -->
  <line x1="110" y1="84" x2="110" y2="115" stroke="url(#sv)" stroke-width="4" stroke-linecap="round"/>
  <!-- Main teardrop body -->
  <path d="M 110 130 C 70 130, 38 195, 38 255 C 38 320, 70 375, 110 375 C 150 375, 182 320, 182 255 C 182 195, 150 130, 110 130 Z"
        fill="url(#svdrop)" filter="url(#svsh)"/>
  <!-- Highlight on teardrop -->
  <path d="M 88 165 C 78 195, 76 235, 80 265" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="8" stroke-linecap="round"/>
  <!-- Secondary highlight -->
  <ellipse cx="132" cy="200" rx="12" ry="25" fill="white" opacity="0.22" transform="rotate(15 132 200)"/>
  <!-- Edge definition -->
  <path d="M 110 130 C 70 130, 38 195, 38 255 C 38 320, 70 375, 110 375 C 150 375, 182 320, 182 255 C 182 195, 150 130, 110 130 Z"
        fill="none" stroke="rgba(80,80,100,0.4)" stroke-width="2"/>
</svg>
