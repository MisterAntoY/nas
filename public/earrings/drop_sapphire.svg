<svg xmlns="http://www.w3.org/2000/svg" width="220" height="400" viewBox="0 0 220 400">
  <defs>
    <linearGradient id="sg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7A5200"/>
      <stop offset="30%"  stop-color="#C89B2A"/>
      <stop offset="50%"  stop-color="#F5E07A"/>
      <stop offset="70%"  stop-color="#C89B2A"/>
      <stop offset="100%" stop-color="#7A5200"/>
    </linearGradient>
    <linearGradient id="sap" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%"   stop-color="#0A1A80"/>
      <stop offset="30%"  stop-color="#1838C8"/>
      <stop offset="55%"  stop-color="#4060E8"/>
      <stop offset="80%"  stop-color="#1838C8"/>
      <stop offset="100%" stop-color="#0A1060"/>
    </linearGradient>
    <linearGradient id="saph" x1="0.15" y1="0.1" x2="0.55" y2="0.55">
      <stop offset="0%"   stop-color="#8090FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8090FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="sapsh">
      <feDropShadow dx="2" dy="5" stdDeviation="6" flood-color="#001080" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Gold hook -->
  <path d="M 110 18 C 110 18, 148 18, 158 38 C 168 58, 150 80, 128 80" fill="none" stroke="url(#sg)" stroke-width="7" stroke-linecap="round"/>
  <line x1="110" y1="18" x2="110" y2="80" stroke="url(#sg)" stroke-width="5.5" stroke-linecap="round"/>
  <!-- Connector -->
  <ellipse cx="110" cy="86" rx="8" ry="8" fill="url(#sg)"/>
  <!-- Gold setting -->
  <rect x="76" y="94" width="68" height="22" rx="6" fill="url(#sg)"/>
  <!-- Diamond halo (small diamonds around sapphire) -->
  <ellipse cx="110" cy="218" rx="82" ry="198" fill="none" stroke="#D4AF37" stroke-width="14" filter="url(#sapsh)"/>
  <!-- Halo diamonds detail -->
  <ellipse cx="110" cy="218" rx="82" ry="198" fill="none" stroke="rgba(255,248,180,0.5)" stroke-width="6" stroke-dasharray="8,6"/>
  <!-- Sapphire oval stone -->
  <ellipse cx="110" cy="218" rx="68" ry="168" fill="url(#sap)"/>
  <!-- Sapphire facets (oval brilliant) -->
  <ellipse cx="110" cy="218" rx="68" ry="168" fill="none" stroke="rgba(80,120,255,0.35)" stroke-width="1.5"/>
  <ellipse cx="110" cy="218" rx="44" ry="110" fill="none" stroke="rgba(80,120,255,0.3)" stroke-width="1"/>
  <line x1="52" y1="158" x2="168" y2="158" stroke="rgba(80,120,255,0.2)" stroke-width="1"/>
  <line x1="52" y1="278" x2="168" y2="278" stroke="rgba(80,120,255,0.2)" stroke-width="1"/>
  <!-- Sapphire highlight -->
  <ellipse cx="110" cy="218" rx="68" ry="168" fill="url(#saph)"/>
  <!-- Specular -->
  <ellipse cx="88" cy="158" rx="20" ry="30" fill="white" opacity="0.25" transform="rotate(-15 88 158)"/>
</svg>
