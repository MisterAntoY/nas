<svg xmlns="http://www.w3.org/2000/svg" width="280" height="280" viewBox="0 0 280 280">
  <defs>
    <linearGradient id="hg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7A5200"/>
      <stop offset="28%"  stop-color="#C89B2A"/>
      <stop offset="50%"  stop-color="#F5E07A"/>
      <stop offset="72%"  stop-color="#C89B2A"/>
      <stop offset="100%" stop-color="#7A5200"/>
    </linearGradient>
    <radialGradient id="hgpost" cx="38%" cy="32%" r="62%">
      <stop offset="0%"   stop-color="#FFECA0"/>
      <stop offset="100%" stop-color="#7A5200"/>
    </radialGradient>
    <filter id="hgsh">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Post/fastening point -->
  <ellipse cx="140" cy="30" rx="8" ry="8" fill="url(#hgpost)"/>
  <rect x="134" y="30" width="12" height="22" rx="4" fill="url(#hg)"/>
  <!-- Huggie hoop (thick, small) -->
  <circle cx="140" cy="158" r="108" fill="none" stroke="rgba(0,0,0,0.18)" stroke-width="48"/>
  <circle cx="140" cy="155" r="106" fill="none" stroke="url(#hg)" stroke-width="44" filter="url(#hgsh)"/>
  <!-- Inner bright ring -->
  <circle cx="140" cy="155" r="106" fill="none" stroke="rgba(255,240,120,0.3)" stroke-width="12"/>
  <!-- Outer edge definition -->
  <circle cx="140" cy="155" r="106" fill="none" stroke="#6B4800" stroke-width="3"/>
  <!-- Top highlight arc -->
  <path d="M 96 58 A 106 106 0 0 1 184 58" fill="none" stroke="rgba(255,245,160,0.55)" stroke-width="12" stroke-linecap="round"/>
</svg>
