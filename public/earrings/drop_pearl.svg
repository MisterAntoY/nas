<svg xmlns="http://www.w3.org/2000/svg" width="220" height="400" viewBox="0 0 220 400">
  <defs>
    <linearGradient id="dpg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7A5200"/>
      <stop offset="30%"  stop-color="#C89B2A"/>
      <stop offset="50%"  stop-color="#F5E07A"/>
      <stop offset="70%"  stop-color="#C89B2A"/>
      <stop offset="100%" stop-color="#7A5200"/>
    </linearGradient>
    <radialGradient id="dpp" cx="36%" cy="30%" r="64%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="30%"  stop-color="#F8F2EA"/>
      <stop offset="65%"  stop-color="#E0D0BC"/>
      <stop offset="100%" stop-color="#B8A890"/>
    </radialGradient>
    <radialGradient id="dpps" cx="62%" cy="65%" r="42%">
      <stop offset="0%"   stop-color="#F0E8DC" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#F0E8DC" stop-opacity="0"/>
    </radialGradient>
    <filter id="dpsh">
      <feDropShadow dx="2" dy="5" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Hook -->
  <path d="M 110 18 C 110 18, 145 18, 156 38 C 167 58, 150 78, 128 78" fill="none" stroke="url(#dpg)" stroke-width="7" stroke-linecap="round"/>
  <line x1="110" y1="18" x2="110" y2="78" stroke="url(#dpg)" stroke-width="5.5" stroke-linecap="round"/>
  <!-- Gold connector beads -->
  <ellipse cx="110" cy="84" rx="7" ry="7" fill="url(#dpg)"/>
  <line x1="110" y1="90" x2="110" y2="115" stroke="url(#dpg)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="5,4"/>
  <ellipse cx="110" cy="120" rx="7" ry="7" fill="url(#dpg)"/>
  <!-- Gold setting cap -->
  <ellipse cx="110" cy="155" rx="42" ry="18" fill="url(#dpg)" opacity="0.9"/>
  <rect x="80" y="130" width="60" height="28" rx="8" fill="url(#dpg)"/>
  <!-- Pearl drop body -->
  <ellipse cx="110" cy="278" rx="88" ry="118" fill="url(#dpp)" filter="url(#dpsh)"/>
  <!-- Pearl orient/luster sheen -->
  <ellipse cx="110" cy="278" rx="88" ry="118" fill="url(#dpps)"/>
  <!-- Specular highlight -->
  <ellipse cx="86" cy="226" rx="22" ry="16" fill="white" opacity="0.55" transform="rotate(-15 86 226)"/>
  <!-- Subtle nacre pattern -->
  <ellipse cx="110" cy="278" rx="88" ry="118" fill="none" stroke="rgba(220,200,180,0.18)" stroke-width="3"/>
</svg>
